<div class="calculator-container">
    <div class="bmi-calculator-card">
        <h2>BMI Kalkulátor</h2>
        <p class="subtitle">Add meg az adataidat és számold ki a BMI-det</p>
        <form (ngSubmit)="onSubmitBMI()" #bmiForm="ngForm">
            <div class="form-group">
                <label for="weight"><i class="fas fa-weight"></i> Súly (kg)</label>
                <input min="0" type="number" id="weight" name="weight" [(ngModel)]="weight" required #weightInput="ngModel" placeholder="Add meg a súlyodat" />
            </div>

            <div class="form-group">
                <label for="height"><i class="fas fa-ruler-vertical"></i> Magasság (cm)</label>
                <input min="0" type="number" id="height" name="height" [(ngModel)]="height" required #heightInput="ngModel" placeholder="Add meg a magasságodat" />
            </div>

            <div class="form-group">
                <label for="age"><i class="fas fa-birthday-cake"></i> Életkor</label>
                <input min="0" type="number" id="age" name="age" [(ngModel)]="age" required #ageInput="ngModel" placeholder="Add meg az életkorodat" />
            </div>

            <div class="form-group">
                <label for="gender"><i class="fas fa-venus-mars"></i> Nem</label>
                <select id="gender" name="gender" [(ngModel)]="gender" required #genderInput="ngModel">
                    <option value="" disabled selected>Válaszd ki a nemedet</option>
                    <option value="male">Férfi</option>
                    <option value="female">Nő</option>
                </select>
            </div>

            <button type="submit" [disabled]="!bmiForm.form.valid">
                <i class="fas fa-calculator"></i> BMI Számolás
            </button>
        </form>

        <div *ngIf="bmi !== null" class="result">
            <h3><i class="fas fa-chart-line"></i> Az eredményed:</h3>
            <p><strong>BMI:</strong> {{ bmi }}</p>
            <p>{{ bmiCategory }}</p>
        </div>
    </div>

    <div class="calorie-calculator-card">
        <h2>Napi Kalória Kalkulátor</h2>
        <p class="subtitle">Add meg az adataidat és számold ki a napi kalória szükségletedet</p>
        <form (ngSubmit)="onSubmitCalories()" #calorieForm="ngForm">
            <div class="calorie-grid">
                <div class="form-group">
                    <label for="calorieWeight"><i class="fas fa-balance-scale"></i> Súly (kg)</label>
                    <input min="0" type="number" id="calorieWeight" name="calorieWeight" [(ngModel)]="calorieWeight" required />
                </div>
                <div class="form-group">
                    <label for="calorieGender"><i class="fas fa-venus-mars"></i> Nem</label>
                    <select id="calorieGender" name="calorieGender" [(ngModel)]="calorieGender" required>
                        <option value="" disabled selected>Válaszd ki a nemedet</option>
                        <option value="male">Férfi</option>
                        <option value="female">Nő</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="calorieHeight"><i class="fas fa-ruler-vertical"></i> Magasság (cm)</label>
                    <input min="0" type="number" id="calorieHeight" name="calorieHeight" [(ngModel)]="calorieHeight" required />
                </div>
                <div class="form-group">
                    <label for="activityLevel"><i class="fas fa-running"></i> Aktivitás szintje</label>
                    <select id="activityLevel" name="activityLevel" [(ngModel)]="activityLevel" required>
                        <option value="" disabled selected>Válaszd ki az aktivitási szintedet</option>
                        <option value="sedentary">Inaktív</option>
                        <option value="light">Könnyű aktivitás</option>
                        <option value="moderate">Mérsékelt aktivitás</option>
                        <option value="active">Aktív</option>
                        <option value="veryActive">Nagyon aktív</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="calorieAge"><i class="fas fa-birthday-cake"></i> Életkor</label>
                    <input min="0" type="number" id="calorieAge" name="calorieAge" [(ngModel)]="calorieAge" required />
                </div>
                <div class="form-group">
                    <label for="goal"><i class="fas fa-bullseye"></i> Cél</label>
                    <select id="goal" name="goal" [(ngModel)]="goal" required>
                        <option value="" disabled selected>Válaszd ki a célodat</option>
                        <option value="maintain">Súly fenntartása</option>
                        <option value="lose">Fogyás</option>
                        <option value="gain">Hízás</option>
                    </select>
                </div>
            </div>
            <button type="submit" [disabled]="!calorieForm.form.valid">
                <i class="fas fa-fire"></i> Napi kalória számolás
            </button>
        </form>
        <div *ngIf="calorieResult !== null" class="result">
            <h3><i class="fas fa-utensils"></i> Napi Kalória Szükséglet:</h3>
            <p>{{ calorieResult }} kcal</p>
        </div>
    </div>
</div>
