<div class="page-container">
    <ng-container *ngIf="authService.isAuthenticated(); else loggedOutHeader">
        <app-header-logged-in></app-header-logged-in>
    </ng-container>
    <ng-template #loggedOutHeader>
        <app-header></app-header>
    </ng-template>
    <main>
        <ng-container *ngIf="showVerticalNav; else mainRouterOutlet">
            <div class="user-page-container">
                <app-vertical-nav-user></app-vertical-nav-user>
                <router-outlet></router-outlet>
            </div>
        </ng-container>
        <ng-template #mainRouterOutlet>
            <router-outlet></router-outlet>
        </ng-template>
    </main>
</div>
<app-footer *ngIf="!hideFooter"></app-footer>
