<header>
    <img routerLink="/" class="logo" src="assets/logo_only.png" alt="Logo">
    <nav>
        <div class="hamburger" (click)="toggleMenu()">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" [ngClass]="{ 'active': isMenuOpen }">
            <li routerLink="/calculator" routerLinkActive="active" (click)="closeMenu()">Kalkulátorok</li>
            <li routerLink="/calorie-counter" routerLinkActive="active" (click)="closeMenu()">Kalóriaszámláló</li>
            <li routerLink="/recipes" routerLinkActive="active" (click)="closeMenu()">Receptek</li>
            <li routerLink="/exercises" routerLinkActive="active" (click)="closeMenu()">Gyakorlatok</li>
            <li routerLink="/workouts" routerLinkActive="active" (click)="closeMenu()">Edzéstervek</li>
            <li routerLink="/diets" routerLinkActive="active" (click)="closeMenu()">Étrendek</li>
        </ul>
        <ul>
            <li routerLink="/user" class="user-icon" (click)="closeMenu()">
                <div class="icon-circle">
                    <img *ngIf="profilePicture" [src]="profilePicture" alt="Profile Picture" class="profile-pic" />
                    <i *ngIf="!profilePicture" class="bi bi-person-fill"></i>
                </div>
            </li>
        </ul>
    </nav>
</header>
