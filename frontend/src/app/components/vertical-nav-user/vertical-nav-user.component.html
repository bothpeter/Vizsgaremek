<div class="vertical-nav-container" [class.show]="isMenuOpen" (click)="$event.stopPropagation()">
    <div class="toggle-btn-container">
        <button class="toggle-btn" (click)="toggleMenu($event)">
            <i class="fas" [ngClass]="isMenuOpen ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
        </button>
    </div>
    
    <div class="user-profile">
        <span class="username">Hello, <span>{{ username }}</span></span>
    </div>

    <ul>
        <li routerLink="/user" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-user"></i><span>Személyes adatok</span>
        </li>
        <li routerLink="/liked-recipes" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-apple-whole"></i><span>Kedvelt receptek</span>
        </li>
        <li routerLink="/liked-exercises" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-dumbbell"></i><span>Kedvelt gyakorlatok</span>
        </li>
        <li routerLink="/manage-uploads" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-upload"></i><span>Feltöltések kezelése</span>
        </li>
        <li routerLink="/change-password" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-lock"></i><span>Jelszó módosítása</span>
        </li>
        <li routerLink="/settings" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <i class="fas fa-cog"></i><span>Beállítások</span>
        </li>
        <li class="nav-item logout" (click)="onLogout(); closeMenu()">
            <i class="fas fa-sign-out-alt"></i><span>Kijelentkezés</span>
        </li>
    </ul>
</div>
