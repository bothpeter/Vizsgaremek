<div class="change-password-container">
    <div class="change-password-card">
        <h2>Jelszó módosítása</h2>
        <p class="subtitle">Add meg az új jelszavad a folytatáshoz</p>
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="password">Új jelszó</label>
                <div class="password-input-container">
                    <input [type]="hidePassword ? 'password' : 'text'" id="password" formControlName="password"
                        placeholder="Add meg az új jelszavad" autocomplete="new-password"
                        [class.invalid]="hasError('password', 'required') || hasError('password', 'invalid')"
                        (input)="onPasswordChange()" />
                    <button type="button" class="toggle-password-visibility" (click)="togglePasswordVisibility()"
                        [attr.aria-label]="hidePassword ? 'Jelszó mutatása' : 'Jelszó elrejtése'" tabindex="-1">
                        <i class="fas" [ngClass]="hidePassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                    </button>
                </div>
                <div *ngIf="hasError('password', 'required')" class="error-message">
                    A jelszó kötelező.
                </div>
                <div *ngIf="hasError('password', 'invalid')" class="error-message">
                    {{ changePasswordForm.get('password')?.errors?.['invalid'] }}
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Jelszó megerősítése</label>
                <div class="password-input-container">
                    <input [type]="hideConfirmPassword ? 'password' : 'text'" id="confirmPassword"
                        formControlName="password_confirmation" placeholder="Erősítsd meg a jelszavad"
                        autocomplete="new-password"
                        [class.invalid]="hasError('password_confirmation', 'required') || hasError('password_confirmation', 'mismatch')"
                        (input)="onPasswordChange()" />
                    <button type="button" class="toggle-password-visibility" (click)="toggleConfirmPasswordVisibility()"
                        [attr.aria-label]="hideConfirmPassword ? 'Jelszó mutatása' : 'Jelszó elrejtése'" tabindex="-1">
                        <i class="fas" [ngClass]="hideConfirmPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                    </button>
                </div>
                <div *ngIf="hasError('password_confirmation', 'required')" class="error-message">
                    A jelszó megerősítése kötelező.
                </div>
                <div *ngIf="hasError('password_confirmation', 'mismatch')" class="error-message">
                    A jelszavak nem egyeznek.
                </div>
            </div>

            <div *ngIf="passwordError" class="error-message">
                {{ passwordError }}
            </div>

            <button type="submit"
                [disabled]="changePasswordForm.invalid || changePasswordForm.value.password !== changePasswordForm.value.password_confirmation || loading">
                <span *ngIf="!loading">Jelszó módosítása</span>
                <div *ngIf="loading" class="button-spinner"></div>
            </button>
        </form>
    </div>
</div>
